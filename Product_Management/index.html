<!doctype html>
<html>
  <head>
    <title>Product management</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <!--Main Nav-->
    <nav class="navbar navbar bg-dark p-4">
      <h3 class="text-white">Admin Page</h3>
    </nav>

    <!--form-->
    <div class="container bordered" id="formContainer">
      <h1 class="mb-4">Add Products</h1>
      <div class="card p-5 bg-light">
        <form id="form">
          <label class="form-label">Product name</label>
          <input type="text" id="productname" class="form-control" placeholder="Enter product name" required />

          <label class="form-label">URL</label>
          <input
            type="url"
            placeholder="Enter URL"
            class="form-control" id="producturl"
            required
          />

          <label class="form-label">Price</label>
          <input type="number" placeholder="Enter Price" id="productprice" class="form-control mb-3" />

          <button type="submit" class="btn btn-primary mt-3" id="save_btn">
            Save product
          </button>

          <button type="reset" class="btn btn-danger" id="reset-button">reset</button>
        </form>
      </div>

      <!--product container-->
      <h3 class="mt-4">Our Products</h3>
      <div class="row" id="productContainer">

      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
